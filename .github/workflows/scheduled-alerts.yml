name: Scheduled alerts
on:
  push:
    branches: ['codex/scheduled-alert-policy']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: scheduled-alerts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install root POM
        run: mvn -B -ntp -Drevision=3.6.10-lts -N install
      - name: Compile backend and run unit and MySQL integration tests
        run: >-
          mvn -B -ntp -f backend/pom.xml -Drevision=3.6.10-lts
          -DskipAntRunForJenkins=true -pl services/test-plan -am package
          -Dtest=ScheduledAlertServiceTest,ScheduledAlertMysqlIT,ApiFailureDetailServiceTest,LarkNoticeSenderTest
          -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: alert-test-reports
          path: backend/services/*/target/surefire-reports/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: alert-backend-jars
          path: |
            backend/framework/domain/target/metersphere-domain-*.jar
            backend/services/system-setting/target/metersphere-system-setting-3.6.10-lts.jar
            backend/services/project-management/target/metersphere-project-management-3.6.10-lts.jar
            backend/services/api-test/target/metersphere-api-test-3.6.10-lts.jar
            backend/services/test-plan/target/metersphere-test-plan-3.6.10-lts.jar
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Identify frontend source
        id: frontend-source
        run: |
          task_frontend_tree=$(git rev-parse HEAD:frontend)
          task_root_pom=$(git rev-parse HEAD:pom.xml)
          echo "key=${task_frontend_tree}-${task_root_pom}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: frontend-cache
        with:
          path: frontend/dist
          key: alert-frontend-${{ runner.os }}-${{ steps.frontend-source.outputs.key }}
      - name: Reuse an existing build of identical frontend source
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        id: frontend-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = (git('rev-parse', 'HEAD:frontend'), git('rev-parse', 'HEAD:pom.xml'))
          artifacts = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/actions/artifacts?name=alert-frontend&per_page=10']))['artifacts']
          for artifact in artifacts:
              if artifact['expired']: continue
              run = artifact.get('workflow_run') or {}
              sha = run.get('head_sha')
              if not sha or run.get('repository_id') != run.get('head_repository_id'): continue
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', sha], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if (git('rev-parse', sha + ':frontend'), git('rev-parse', sha + ':pom.xml')) == expected:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('run-id=' + str(run['id']) + '\n')
                  print('Reusing previously built artifact with matching frontend and root POM trees')
                  break
          PYCODE
      - uses: actions/download-artifact@v8.0.2
        if: steps.frontend-artifact.outputs.run-id != ''
        with:
          name: alert-frontend
          run-id: ${{ steps.frontend-artifact.outputs.run-id }}
          github-token: ${{ github.token }}
          path: frontend/dist/
      - name: Type-check and build frontend with the project toolchain
        if: steps.frontend-cache.outputs.cache-hit != 'true' && steps.frontend-artifact.outputs.run-id == ''
        run: mvn -B -ntp -Drevision=3.6.10-lts -Dmaven.test.skip=true -pl frontend package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: alert-frontend
          path: frontend/dist/
  acceptance:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: alert-backend-jars
          path: backend/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: alert-frontend
          path: frontend/dist/
      - name: Build community runtime image
        run: docker build -f deploy/alerts/Dockerfile -t metersphere-alerts:acceptance .
      - name: Exercise real scheduled executions and notification delivery
        run: python3 deploy/alerts/smoke.py --image metersphere-alerts:acceptance
